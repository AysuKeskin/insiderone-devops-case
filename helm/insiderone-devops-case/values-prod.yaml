# prod overrides — 3 base replicas, autoscale up to 10, tighter limits,
# info-level logs, prod hostname.
replicaCount: 3

config:
  PORT: "8080"
  LOG_LEVEL: "info"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

ingress:
  enabled: true
  className: nginx
  # Real domain + HTTPS. A catch-all rule is still emitted (template) so the raw
  # Elastic IP keeps answering over HTTP. TLS cert is issued by cert-manager
  # (letsencrypt-dns ClusterIssuer) — see RUNBOOK "TLS / HTTPS" for the one-time
  # cluster setup (cert-manager + cloudflare-api-token secret + issuer).
  host: devops-case.aysu-keskin.uk
  tls:
    enabled: true
    secretName: insiderone-devops-case-tls
    clusterIssuer: letsencrypt-dns

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
