# HTTPS overlay — serve the app on a real domain with a Let's Encrypt cert
# issued by cert-manager (DNS-01 via Cloudflare). Layer on top of prod values:
#
#   helm upgrade --install insiderone-devops-case helm/insiderone-devops-case \
#     -f helm/insiderone-devops-case/values-prod.yaml \
#     -f helm/insiderone-devops-case/values-tls.yaml
#
# Prereqs on the cluster: cert-manager installed (`make tls-install`), the
# `letsencrypt-dns` ClusterIssuer applied (deploy/tls/clusterissuer.yaml), and a
# `cloudflare-api-token` secret. See RUNBOOK "TLS / HTTPS".
ingress:
  enabled: true
  className: nginx
  host: insiderone-devopscase.aysu-keskin.uk
  tls:
    enabled: true
    secretName: insiderone-devops-case-tls
    clusterIssuer: letsencrypt-dns
