{{- if .Values.secret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "insiderone-devops-case.fullname" . }}-secret
  labels:
    {{- include "insiderone-devops-case.labels" . | nindent 4 }}
type: Opaque
{{- with .Values.secret.stringData }}
stringData:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
