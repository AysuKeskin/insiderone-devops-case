{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "kube-pulse.fullname" . }}
  labels:
    {{- include "kube-pulse.labels" . | nindent 4 }}
    # kube-prometheus-stack's Prometheus only selects ServiceMonitors carrying
    # this release label; it must match the monitoring Helm release name.
    release: {{ .Values.metrics.serviceMonitor.releaseLabel }}
spec:
  selector:
    matchLabels:
      {{- include "kube-pulse.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.metrics.serviceMonitor.path }}
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
