{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kube-pulse.fullname" . }}
  labels:
    {{- include "kube-pulse.labels" . | nindent 4 }}
  {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.clusterIssuer }}
  annotations:
    # cert-manager watches this and provisions the TLS secret via the issuer.
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if and .Values.ingress.tls.enabled .Values.ingress.host }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  {{- end }}
  # A non-empty host gets its own rule (required for TLS/SNI). A catch-all rule
  # is always emitted too, so the service still answers on the raw public IP
  # (no Host header) even when a domain is set.
  rules:
    {{- if .Values.ingress.host }}
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "kube-pulse.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
    {{- end }}
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "kube-pulse.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
