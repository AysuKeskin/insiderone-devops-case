{{- if .Values.secret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kube-pulse.fullname" . }}-secret
  labels:
    {{- include "kube-pulse.labels" . | nindent 4 }}
type: Opaque
{{- with .Values.secret.stringData }}
stringData:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
