# Local development only. Production deploys via the Helm chart in
# helm/insiderone-devops-case/ to Kubernetes (minikube on EC2).
#
# PORT and HOST_PORT come from .env (see .env.example). Defaults are
# 8080 because non-root containers cannot bind to ports < 1024.

services:
  app:
    build:
      context: .
      args:
        VERSION: dev
        COMMIT: local
    image: insiderone-devops-case:local
    ports:
      - "${HOST_PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: "${PORT:-8080}"
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # No healthcheck: distroless has no shell/wget/curl. K8s probes
    # in the Helm chart cover this for the real deployment. For local
    # dev, hit /healthz from the host.
