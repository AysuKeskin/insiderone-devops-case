name: Deploy

# Continuous deployment: when CI succeeds on main, roll the new image out to
# the EC2 minikube via SSM. No SSH, no long-lived AWS keys - the job assumes a
# short-lived role through GitHub OIDC.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy, for example sha-abc1234 or v0.1.0. Defaults to this workflow ref short SHA."
        required: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to EC2 minikube
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: guard deploy ref
        run: |
          set -euo pipefail
          case "${GITHUB_REF}" in
            refs/heads/main|refs/tags/v*) ;;
            *)
              echo "Deploy is only allowed from main or v* tags, got ${GITHUB_REF}"
              exit 1
              ;;
          esac

      - name: resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="sha-${HEAD_SHA:0:7}"
          fi

          case "$TAG" in
            latest) ;;
            sha-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Invalid image tag: $TAG"
              exit 1
              ;;
          esac

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying image tag: $TAG"

      - name: configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: helm upgrade on EC2 via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          PARAMS=$(jq -n --arg tag "$TAG" '{
            commands: [
              "runuser -l ec2-user -c \"cd /opt/app && git pull --ff-only && helm upgrade --install insiderone-devops-case ./helm/insiderone-devops-case -f helm/insiderone-devops-case/values-prod.yaml --set-string image.tag=\($tag) --wait --atomic --timeout 3m && kubectl rollout status deployment/insiderone-devops-case --timeout=3m\""
            ]
          }')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy $TAG" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" --output text)
          echo "SSM command id: $CMD_ID"

          for _ in $(seq 1 36); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                echo "::group::stderr from EC2"
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
                echo "::endgroup::"
                exit 1
                ;;
            esac
          done

          if [ "${STATUS:-}" != "Success" ]; then
            echo "deploy did not reach Success in time (last: ${STATUS:-unknown})"
            exit 1
          fi

          echo "::group::stdout from EC2"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          echo "::endgroup::"
