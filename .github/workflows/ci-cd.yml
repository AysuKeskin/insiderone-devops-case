name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

# Default token: read-only. Jobs that need more (push to GHCR, OIDC for
# cosign and the EC2 deploy) escalate their own permissions.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  IMAGE: ghcr.io/aysukeskin/insiderone-devops-case

jobs:
  lint-and-test:
    name: lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test (race + cover)
        run: go test ./... -race -cover

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

  helm-lint:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: lint chart against dev and prod values
        run: |
          helm lint helm/insiderone-devops-case -f helm/insiderone-devops-case/values-dev.yaml
          helm lint helm/insiderone-devops-case -f helm/insiderone-devops-case/values-prod.yaml

  build-scan-push:
    name: build, scan, push
    runs-on: ubuntu-latest
    needs: [lint-and-test, secret-scan, helm-lint]
    permissions:
      contents: read
      packages: write   # push to GHCR (only used on non-PR events); auth via GITHUB_TOKEN
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: derive build args
        id: vars
        run: |
          {
            echo "version=$(git describe --tags --always --dirty)"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Build once into the local docker so Trivy can scan it before anything is
      # published. The layer cache is saved so the push step below reuses it
      # instead of recompiling.
      - name: build image for scan (local, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: local/insiderone-devops-case:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            COMMIT=${{ steps.vars.outputs.commit }}
            BUILT_AT=${{ steps.vars.outputs.built_at }}

      - name: Trivy vulnerability scan (CRITICAL/HIGH gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/insiderone-devops-case:scan
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          format: table

      # Everything below only runs once the scan passes, and only off PRs:
      # PRs validate + scan but never publish.
      - name: log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push scanned image to GHCR
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha   # reuses the scan build's layers — no recompile
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            COMMIT=${{ steps.vars.outputs.commit }}
            BUILT_AT=${{ steps.vars.outputs.built_at }}

      - name: report outcome
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::notice::PR build — image scanned (no CRITICAL/HIGH), not published"
          else
            echo "::notice::published ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}"
            {
              echo "### Image published"
              echo "- digest: \`${{ steps.push.outputs.digest }}\`"
              echo '- tags:'
              echo '```'
              echo "${{ steps.meta.outputs.tags }}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  sign-and-sbom:
    name: cosign sign and Syft SBOM
    runs-on: ubuntu-latest
    needs: [build-scan-push]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@v3

      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: cosign sign (keyless, OIDC)
        run: |
          cosign sign --yes "${{ env.IMAGE }}@${{ needs.build-scan-push.outputs.digest }}"

      - name: generate SPDX SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ needs.build-scan-push.outputs.digest }}
          format: spdx-json
          upload-artifact: false
          output-file: sbom.spdx.json

      - name: cosign attest SBOM (bind it to the image)
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json --type spdxjson \
            "${{ env.IMAGE }}@${{ needs.build-scan-push.outputs.digest }}"

      - name: upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [sign-and-sbom]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # create the GitHub Release
    steps:
      - uses: actions/checkout@v4   # for CHANGELOG

      - name: download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom

      # Pull this tag's version section out of CHANGELOG.md so the release notes
      # are the changelog entry, not an empty body.
      - name: extract release notes from CHANGELOG
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="${VERSION#v}"
          awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; print; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::no CHANGELOG section for $VER; using a default note"
            echo "Release $VERSION" > release-notes.md
          fi
          echo "----- release notes -----"; cat release-notes.md

      - name: create GitHub Release with notes + SBOM
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: sbom.spdx.json

  deploy:
    name: deploy to EC2 minikube
    runs-on: ubuntu-latest
    needs: [build-scan-push, sign-and-sbom]
    # Auto-deploy only on a push to main. Tag pushes (v*) are released and
    # signed but not re-deployed — that commit already shipped when it hit main.
    # A bad image is auto-rolled-back on the box by helm --atomic.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write   # assume the AWS deploy role via OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4   # needed so the local ./.github/actions/ssm-deploy is on disk

      - name: resolve and validate image tag
        id: tag
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="sha-${SHA:0:7}"
          # Defense in depth: TAG ends up in a remote shell command, so accept
          # only the sha-<hex> shape CI publishes.
          if ! printf '%s' "$TAG" | grep -Eq '^sha-[0-9a-f]{7,40}$'; then
            echo "::error::refusing to deploy untrusted tag: '$TAG'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::Image tag: $TAG (signed digest ${{ needs.build-scan-push.outputs.digest }})"

      - name: configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: helm upgrade via SSM
        uses: ./.github/actions/ssm-deploy
        with:
          instance-id: ${{ secrets.EC2_INSTANCE_ID }}
          label: deploy
          command: >-
            cd /opt/app && git pull --ff-only &&
            helm upgrade --install insiderone-devops-case ./helm/insiderone-devops-case
            -f helm/insiderone-devops-case/values-prod.yaml
            --set-string image.tag=${{ steps.tag.outputs.tag }}
            --atomic --timeout 3m &&
            kubectl rollout status deployment/insiderone-devops-case --timeout=3m &&
            echo === helm history === && helm history insiderone-devops-case --max 5 &&
            echo === pods === &&
            kubectl get pods -l app.kubernetes.io/name=insiderone-devops-case -o wide

      - name: deploy summary
        run: |
          {
            echo "### Deploy succeeded"
            echo "- tag: \`${{ steps.tag.outputs.tag }}\`"
            echo "- verify: \`curl http://<elastic-ip>/version\`"
          } >> "$GITHUB_STEP_SUMMARY"
