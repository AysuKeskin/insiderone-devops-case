name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

# Default token: read-only. Jobs that need more (push to GHCR, OIDC for
# cosign and the EC2 deploy) escalate their own permissions.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  IMAGE: ghcr.io/aysukeskin/insiderone-devops-case

jobs:
  lint-and-test:
    name: lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test (race + cover)
        run: go test ./... -race -cover

  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

  helm-lint:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: lint chart against dev and prod values
        run: |
          helm lint helm/insiderone-devops-case -f helm/insiderone-devops-case/values-dev.yaml
          helm lint helm/insiderone-devops-case -f helm/insiderone-devops-case/values-prod.yaml

  build-and-scan:
    name: build image and Trivy scan
    runs-on: ubuntu-latest
    needs: [lint-and-test, gitleaks, helm-lint]
    steps:
      - uses: actions/checkout@v4

      - name: derive build args
        id: vars
        run: |
          echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: build image (load, do not push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: local/insiderone-devops-case:scan
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            COMMIT=${{ steps.vars.outputs.commit }}
            BUILT_AT=${{ steps.vars.outputs.built_at }}

      - name: Trivy vulnerability scan (CRITICAL/HIGH gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/insiderone-devops-case:scan
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          format: table

  push:
    name: push to GHCR
    runs-on: ubuntu-latest
    needs: [lint-and-test, gitleaks, build-and-scan]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: derive build args
        id: vars
        run: |
          echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            COMMIT=${{ steps.vars.outputs.commit }}
            BUILT_AT=${{ steps.vars.outputs.built_at }}

  sign-and-sbom:
    name: cosign sign and Syft SBOM
    runs-on: ubuntu-latest
    needs: [push]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@v3

      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: cosign sign (keyless, OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes "${{ env.IMAGE }}@${{ needs.push.outputs.digest }}"

      - name: generate SPDX SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ needs.push.outputs.digest }}
          format: spdx-json
          artifact-name: sbom.spdx.json
          output-file: sbom.spdx.json

      - name: attach SBOM to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sbom.spdx.json

  # Smoke gate: deploy the new image to a throwaway `dev` release first. If the
  # chart/image can't reach Ready with dev values, prod is never touched.
  deploy-dev:
    name: deploy to dev (smoke gate)
    runs-on: ubuntu-latest
    needs: [push, sign-and-sbom]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write   # assume the AWS deploy role via OIDC
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: resolve and validate image tag
        id: tag
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="sha-${SHA:0:7}"
          # Defense in depth: TAG ends up in a remote shell command, so accept
          # only the sha-<hex> shape CI publishes.
          if ! printf '%s' "$TAG" | grep -Eq '^sha-[0-9a-f]{7,40}$'; then
            echo "::error::refusing to deploy untrusted tag: '$TAG'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::Image tag: $TAG (signed digest ${{ needs.push.outputs.digest }})"

      - name: configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: helm upgrade (dev release) via SSM
        uses: ./.github/actions/ssm-deploy
        with:
          instance-id: ${{ secrets.EC2_INSTANCE_ID }}
          label: deploy-dev
          command: >-
            cd /opt/app && git pull --ff-only &&
            helm upgrade --install insiderone-devops-case-dev ./helm/insiderone-devops-case
            -f helm/insiderone-devops-case/values-dev.yaml
            --namespace dev --create-namespace
            --set-string image.tag=${{ steps.tag.outputs.tag }}
            --set ingress.enabled=false --atomic --timeout 3m &&
            kubectl -n dev rollout status deployment/insiderone-devops-case-dev --timeout=3m &&
            echo === dev pods === &&
            kubectl -n dev get pods -o wide

  deploy-prod:
    name: deploy to prod (EC2 minikube)
    runs-on: ubuntu-latest
    needs: [deploy-dev]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: helm upgrade (prod release) via SSM
        uses: ./.github/actions/ssm-deploy
        with:
          instance-id: ${{ secrets.EC2_INSTANCE_ID }}
          label: deploy-prod
          command: >-
            cd /opt/app && git pull --ff-only &&
            helm upgrade --install insiderone-devops-case ./helm/insiderone-devops-case
            -f helm/insiderone-devops-case/values-prod.yaml
            --set-string image.tag=${{ needs.deploy-dev.outputs.tag }}
            --atomic --timeout 3m &&
            kubectl rollout status deployment/insiderone-devops-case --timeout=3m &&
            echo === helm history === && helm history insiderone-devops-case --max 5 &&
            echo === prod pods === &&
            kubectl get pods -l app.kubernetes.io/name=insiderone-devops-case -o wide

      - name: deploy summary
        run: |
          {
            echo "### Deploy succeeded"
            echo "- tag: \`${{ needs.deploy-dev.outputs.tag }}\`"
            echo "- verify: \`curl http://<elastic-ip>/version\`"
          } >> "$GITHUB_STEP_SUMMARY"
