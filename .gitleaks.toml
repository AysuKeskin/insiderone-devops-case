# gitleaks config — inherits default ruleset and only narrows it where needed.
# We do not store any real credentials in this repo; AWS access is via
# GitHub OIDC and Helm secrets are injected at deploy time.

[extend]
useDefault = true

[allowlist]
description = "Globally trusted paths and known-safe placeholders"
paths = [
  '''\.gitleaks\.toml$''',
  '''(^|/)\.env\.example$''',
  '''(^|/)docs/evidence/.*''',
  '''(^|/)go\.sum$''',
]
# Allow only the obvious placeholder *values* used in .env.example and docs.
# Anchored so a real secret containing "example" inside its value is NOT
# whitelisted.
regexes = [
  '''(?i)^(example|placeholder|dummy|changeme|x{8,})$''',
]
